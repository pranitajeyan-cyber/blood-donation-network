<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0B0D" />

    <title>Blood Donation Network</title>
    <meta
      name="description"
      content="An open-source platform that matches blood requests to compatible, nearby, eligible donors and widens its own search every fifteen minutes until the need is met."
    />
    <meta name="author" content="Blood Donation Network contributors" />
    <meta name="robots" content="index, follow" />

    <!-- The canonical URL and og:url are written per route at runtime, so a
         deployment keeps them correct on whatever domain it is served from. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blood Donation Network" />
    <meta
      property="og:title"
      content="Blood Donation Network — escalating donor matching"
    />
    <meta
      property="og:description"
      content="A directory answers a request. This escalates it: compatible, nearby, eligible donors first, then a widening search every fifteen minutes."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Blood Donation Network — a directory answers a request, this escalates it."
    />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Blood Donation Network — escalating donor matching"
    />
    <meta
      name="twitter:description"
      content="Compatible, nearby, eligible donors first, then a widening search every fifteen minutes until the need is met."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="preload"
      href="/fonts/inter-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Blood Donation Network",
        "description": "An open-source donor-matching and blood-shortage forecasting platform with time-based escalation, built with FastAPI, SQLAlchemy and React.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/pranitajeyan-cyber/blood-donation-network"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 18vh auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #e6e8eb; background: #0a0b0d; line-height: 1.6">
        <h1 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem">Blood Donation Network</h1>
        <p>
          This is a single-page application and needs JavaScript to run. The platform
          matches blood requests against compatible, nearby and eligible donors, then
          widens the search on a timer. The JSON API it uses is documented at
          <a href="/docs" style="color: #f0566a">/docs</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
