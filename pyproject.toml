[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-donation-network"
version = "0.1.0"
description = "A predictive, escalating marketplace for blood donation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranita Jeyan" }]
keywords = ["fastapi", "blood-donation", "forecasting", "matching-engine"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # B008: FastAPI's dependency injection puts function calls in default
    # arguments (`db: Session = Depends(get_db)`). That is the framework's
    # documented idiom, not the mutable-default bug B008 is about.
    "B008",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]  # a demo-data generator, not application logic

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
